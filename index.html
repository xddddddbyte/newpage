<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="colors.css">
        <title>* wow</title>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body>
        <main>
            <div id="center">  
                <div class="song">
                    <img alt="image" src="assets/randomshi2.png">
                </div>
            </div>
        <style>
            .song {
                min-width: 320px;
                max-width: 100%;
                min-height: 320px;
                max-height: 100%;
                position: relative;
                color: black;
                cursor: pointer;
            }
            .song img {
                max-width: 100%;
                max-height: 100%;
                image-rendering: pixelated;
                object-fit: contain;
            }       
        </style>
        <script>

            var song = new Howl({
                src: ['assets/glaceir.ogg', 'assets/glaceir.mp3'],
                loop: true,
                volume: 0.5,
            });

            $(document).on('click', '.song:not(.playing)', function() {
                song.play();
                $('.song').addClass('playing');
            });

            $(document).on('click', '.song.playing', function() {
                song.stop();
                $('.song').removeClass('playing');
            });
            
        </script>
        </main>
    </body>
</html>
